<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GREAK TOWER V0.6</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <!-- TOP HUD -->
    <div id="hud">

        <div id="brand">
            GREAK TOWER
            <span class="version">V0.6</span>
        </div>

        <div id="stats">

            <div class="stat">
                💰 <span id="coins">100</span>
            </div>

            <div class="stat">
                ❤️ <span id="baseHealth">100</span>
            </div>

            <div class="stat">
                🌊 Wave <span id="wave">1</span>
            </div>

            <div class="stat">
                ⭐ <span id="xp">0</span> XP
            </div>

        </div>

    </div>


    <!-- BOTTOM CONTROLS -->
    <div id="controls">

        <button id="startWave">
            🌊 START WAVE
        </button>

        <button id="towerButton">
            🏰 TOWER
        </button>

        <button id="achievementsButton">
            🏆
        </button>

    </div>


    <div id="message"></div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
