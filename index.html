<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GREAK TOWER</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- GAME -->
    <div id="game"></div>

    <!-- TOP HUD -->
    <div id="hud">

        <div id="brand">
            GREAK TOWER
        </div>

        <div id="stats">

            <div class="stat">
                💰 <span id="coins">100</span>
            </div>

            <div class="stat">
                ❤️ <span id="baseHealth">100</span>
            </div>

            <div class="stat">
                🌊 Wave <span id="wave">1</span>
            </div>

        </div>

    </div>

    <!-- BOTTOM CONTROLS -->
    <div id="controls">

        <button id="startWave">
            START WAVE
        </button>

        <button id="towerButton">
            🏰 TOWER
        </button>

    </div>

    <!-- MESSAGE -->
    <div id="message"></div>

    <!-- THREE.JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- GAME SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
